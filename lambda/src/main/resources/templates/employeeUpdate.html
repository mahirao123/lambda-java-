<!DOCTYPE html>
<html
data-th-replace="~{base :: parent(~{:: #content},~{::title},~{::script})}"
lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title
        data-th-text="${loggedInEmployee != null ? loggedInEmployee.name + ' | Dashboard' : 'Dashboard'}">
        HrPage
    </title>
</head>

<body class="bg-gray-200">

    <div id="content" class="min-h-screen flex flex-col">

        <!-- Sidebar + Navbar -->
        <div th:if="${loggedInEmployee != null}">

            <!-- Sidebar -->
            <div th:replace="~{hr/sidebar :: hrsidebar}"></div>

            <!-- Navbar -->
            <div th:replace="~{hr/navbar :: hrnavbar}"></div>

        </div>

        <!-- Main Content -->
        <main
            class="flex-1 px-4 sm:ml-64 transition-all duration-300">

            <div class="bg-white p-6 rounded-lg shadow">
				
				<div class="min-h-screen flex items-center justify-center p-4">

				    <div class="w-full max-w-4xl bg-white shadow-xl rounded-2xl p-8">

				        <h2 class="text-3xl font-bold text-center text-blue-600 mb-5"> Employee Registration</h2>
						<div data-th-replace="message::messagebox"></div>
						<div th:if="${error}"
						     class=" text-red-600 text-center">

						    <span th:text="${error}" class="bg-red-100 mb-3"></span>

						</div>
<form th:action="@{'/employee/update/'+${employeeId}}"
      method="post"
      enctype="multipart/form-data"
      th:object="${employee}"
      class="space-y-6">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <!-- Name -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Employee Name
            </label>

            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter employee name"
                   class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-3">

            <p th:errors="*{name}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Email -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Email
            </label>

            <input type="email"
                   th:field="*{email}"
                   placeholder="Enter email"
                   class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-3">

            <p th:errors="*{email}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Phone -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Phone Number
            </label>

            <input type="text"
                   th:field="*{phoneNumber}"
                   placeholder="Enter phone number"
                   class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-3">

            <p th:errors="*{phoneNumber}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Password -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Password
            </label>

            <input type="password"
                   th:field="*{password}"
                   placeholder="Enter password"
                   class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-3">

            <p th:errors="*{password}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Role -->
        <div>
            <label class="block mb-2 font-medium">
                Select Role
            </label>

			<select th:field="*{role}"
			        class="w-full border border-gray-300 rounded-lg p-3">

			    <option value="">-- Select Role --</option>
			    <option value="ROLE_HR">HR Department</option>
			    <option value="ROLE_SALES">Sales Department</option>
			    <option value="ROLE_FINANCE">Finance Department</option>
			    <option value="ROLE_SOCIAL_MEDIA">Social Media Department</option>
			    <option value="ROLE_PODCASTER">Podcaster</option>
			    <option value="ROLE_EDITOR">Editor</option>
			    <option value="ROLE_ANCHOR">Anchor</option>
			    <option value="ROLE_MANAGER">Manager</option>
			    <option value="ROLE_MANAGEMENT">Management Department</option>
			</select>

            <p th:errors="*{role}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Joining Date -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Joining Date
            </label>

            <input type="date"
                   th:field="*{joiningDate}"
                   class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-3">

            <p th:errors="*{joiningDate}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Profile Picture -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Profile Picture
            </label>

            <input type="file"
			       th:field="*{profilePic}"
				   id="image_file_input"
                   accept=".jpg,.jpeg,.png"
                   class="w-full border border-gray-300 rounded-lg p-3">

            <p th:errors="*{profilePic}"
               class="text-red-600 text-sm mt-1"></p>
			   
			   <img src="" id="upload_image_preview" alt=""/>
        </div>

        <!-- Aadhaar PDF -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Aadhaar PDF
            </label>

            <input type="file"
			       th:field="*{adharPdf}"
                   name="adharPdf"
                   accept=".pdf"
                   class="w-full border border-gray-300 rounded-lg p-3">

            <p th:errors="*{adharPdf}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Degree PDF -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Degree PDF
            </label>

            <input 
			th:field="*{degreePdf}"
			type="file"
                   name="degreePdf"
                   accept=".pdf"
                   class="w-full border border-gray-300 rounded-lg p-3">

            <p th:errors="*{degreePdf}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Bank Account Pic -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Bank Account Picture
            </label>

            <input 
			th:field="*{bankAccountPic}"
			type="file"
                   name="bankAccountPic"
                   accept=".jpg,.jpeg,.png"
                   class="w-full border border-gray-300 rounded-lg p-3">

            <p th:errors="*{bankAccountPic}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- Experience Letter -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                Experience Letter PDF
            </label>

            <input 
			th:field="*{experienceLetterPdf}"
			type="file"
                   name="experienceLetterPdf"
                   accept=".pdf"
                   class="w-full border border-gray-300 rounded-lg p-3">

            <p th:errors="*{experienceLetterPdf}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

        <!-- PAN Card -->
        <div>
            <label class="block mb-2 text-sm font-medium">
                PAN Card Image
            </label>

            <input
			th:field="*{panPic}"
			 type="file"

                   accept=".jpg,.jpeg,.png"
                   class="w-full border border-gray-300 rounded-lg p-3">

            <p th:errors="*{panPic}"
               class="text-red-600 text-sm mt-1"></p>
        </div>

    </div>

    <div class="text-center space-2">
        <button type="submit"
                class="text-white bg-blue-300 hover:bg-blue-800 rounded-lg text-sm px-8 py-3">
            Update Employee
        </button>
		
        <a th:href="@{/hr/employeeList}"
                class="text-white bg-red-300 hover:bg-blue-800 rounded-lg text-sm px-8 py-3">
            Cancel
        </a>
    </div>

</form>

				    </div>

				</div>
            </div>

        </main>

    </div>

    <script>
        console.log("HR Dashboard Loaded");
    </script>

</body>

</html>
