<!DOCTYPE html>
<html
data-th-replace="~{base :: parent(~{:: #content},~{::title},~{::script})}"
lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title
        data-th-text="${loggedInEmployee != null ? loggedInEmployee.name + ' | Dashboard' : 'Dashboard'}">
        Employee Page
    </title>
</head>

<body>

<div id="content" class="min-h-screen flex flex-col">

    <main class="flex-1 px-4 sm:ml-64 transition-all duration-300">

        <div class="min-h-screen bg-gray-100 p-6">

            <div class="w-full bg-white rounded-2xl shadow-lg p-8"
                 th:if="${employeeProfile != null}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">

                    <!-- Profile -->
                    <div class="flex flex-col items-center text-center">

						<img th:src="${employeeProfile.profilePic != null ? employeeProfile.profilePic : '/images/profile.png'}"
						     onerror="this.src='/images/profile.png'"
						     class="w-40 h-40 rounded-full border-4 border-blue-500 object-cover">

                        <a th:href="@{'/employee/update_employee/' + ${employeeProfile.employeeId}}"
                           class="mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                            Edit Profile
                        </a>

                        <h2 class="mt-4 text-3xl font-semibold"
                            th:text="${employeeProfile.name}"></h2>

                        <p class="text-gray-500 text-lg"
                           th:text="${employeeProfile.email}"></p>

                    </div>

                    <!-- Details -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">

                        <div>
                            <b class="text-gray-700">Phone:</b><br>
                            <span th:text="${employeeProfile.phoneNumber}"></span>
                        </div>

                        <div>
                            <b class="text-gray-700">Joining Date:</b><br>
                            <span th:text="${employeeProfile.joiningDate}"></span>
                        </div>

                        <div>
                            <b class="text-gray-700">Role:</b><br>
                            <span th:text="${employeeProfile.role}"></span>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

    <script>
        console.log("HR Dashboard Loaded");
    </script>

</body>

</html>
