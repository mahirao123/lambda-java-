<aside
    data-th-fragment="hrsidebar"
    id="logo-sidebar"
    class="fixed top-0 left-0 z-60
           w-64 h-screen
           transition-transform
           -translate-x-full
           sm:translate-x-0"
    aria-label="Sidebar">

    <div class="h-full px-3 py-4 overflow-y-auto
                bg-gray-50 dark:bg-gray-800">

        <a href="#"
           class="flex items-center ps-2.5 mb-5">

            <img
                src="https://flowbite.com/docs/images/logo.svg"
                class="h-6 me-3 sm:h-7"
                alt="Flowbite Logo">

            <span class="self-center text-xl font-semibold
                         whitespace-nowrap dark:text-white">
                Flowbite
            </span>

        </a>

        <ul class="space-y-2 font-medium">

            <!-- Dashboard -->
            <li>
                <a
                    data-th-href="@{'/hr/dashboard'}"
                    class="flex items-center p-2
                           text-gray-900 rounded-lg
                           dark:text-white
                           hover:bg-gray-100
                           dark:hover:bg-gray-700
                           group">

                    <svg class="w-5 h-5 text-gray-500"
                         fill="currentColor"
                         viewBox="0 0 22 21">

                        <path d="M16.975 11H10V4.025a1 1 0 0 0-1.066-.998
                                 8.5 8.5 0 1 0 9.039 9.039.999.999 0 0 0-1-1.066h.002Z"/>

                        <path d="M12.5 0c-.157 0-.311.01-.565.027A1 1 0
                                 0 0 11 1.02V10h8.975a1 1 0 0 0 1-.935c.013-.188
                                 .028-.374.028-.565A8.51 8.51 0 0 0 12.5 0Z"/>

                    </svg>

                    <span class="ms-3">
                        Dashboard
                    </span>
                </a>
            </li>

            <!-- Profile -->
            <li>
                <a
                    data-th-href="@{'/employee/profile'}"
                    class="flex items-center p-2
                           text-gray-900 rounded-lg
                           dark:text-white
                           hover:bg-gray-100
                           dark:hover:bg-gray-700">

                    <svg class="shrink-0 w-5 h-5 text-gray-500"
                         fill="currentColor"
                         viewBox="0 0 18 18">

                        <path d="M6.143 0H1.857A1.857 1.857 0 0 0 0
                                 1.857v4.286C0 7.169.831 8 1.857 8h4.286A1.857
                                 1.857 0 0 0 8 6.143V1.857A1.857 1.857 0
                                 0 0 6.143 0Z"/>

                    </svg>

                    <span class="flex-1 ms-3 whitespace-nowrap">
                        Profile
                    </span>

                    <span class="inline-flex items-center
                                 justify-center px-2 ms-3
                                 text-sm font-medium
                                 text-green-800
                                 bg-gray-100 rounded-full">
                        Manage
                    </span>

                </a>
            </li>

            <!-- Employees -->
            <li>
                <a
                    data-th-href="@{'/hr/employeeList'}"
                    class="flex items-center p-2
                           text-gray-900 rounded-lg
                           dark:text-white
                           hover:bg-gray-100
                           dark:hover:bg-gray-700">

                    <i class="fa-solid fa-users w-5 h-5"></i>

                    <span class="flex-1 ms-3 whitespace-nowrap">
                        Employees
                    </span>

                </a>
            </li>

            <!-- Register Employee -->
            <li>
                <a
                    data-th-href="@{'/employee/signup'}"
                    class="flex items-center p-2
                           text-gray-900 rounded-lg
                           dark:text-white
                           hover:bg-gray-100
                           dark:hover:bg-gray-700">

                    <i class="fa-solid fa-address-book"></i>

                    <span class="flex-1 ms-3 whitespace-nowrap">
                        Register New Employee
                    </span>

                </a>
            </li>

            <!-- Complain -->
            <li>
                <a
                    data-th-href="@{'/hr/complainLinks/save'}"
                    class="flex items-center p-2
                           text-gray-900 rounded-lg
                           dark:text-white
                           hover:bg-gray-100
                           dark:hover:bg-gray-700">

                    <i class="fa-solid fa-comment"></i>

                    <span class="flex-1 ms-3 whitespace-nowrap">
                        Add Complain Form
                    </span>

                </a>
            </li>

            <!-- Logout -->
            <li>
                <a
                    data-th-href="@{'/employee/logout'}"
                    class="flex items-center p-2
                           text-gray-900 rounded-lg
                           dark:text-white
                           hover:bg-gray-100
                           dark:hover:bg-gray-700">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    <span class="flex-1 ms-3 whitespace-nowrap">
                        Logout
                    </span>

                </a>
            </li>

        </ul>

    </div>

</aside>
