<!DOCTYPE html>

<html data-th-replace="~{base :: parent(~{:: #content},~{::title},~{::script})}" lang="en">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title
		data-th-text="${loggedInEmployee != null ? loggedInEmployee.name + ' | updateMainSlide' : 'updateMainSlide'}">
		updateMainSlide
	</title>

</head>

<body class="bg-gray-200">

	<div id="content" class="min-h-screen flex flex-col">

		<!-- Main Content -->
		<main class="flex-1 px-4 sm:ml-64 transition-all duration-300">

			<div class="container mx-auto px-4 py-8">

				<div class="max-w-xl mx-auto">

					<div class="bg-white rounded-xl shadow-lg">

						<!-- Header -->
						<div class="border-b px-6 py-4">

							<h2 class="text-2xl font-bold text-gray-800">
								Update Main Slide
							</h2>

							<p class="text-gray-500 mt-1">
								Update the slide details below.
							</p>

						</div>

						<!-- Message -->
						<div data-th-replace="~{message::messagebox}"></div>


						<!-- Form -->
						<form th:action="@{'/editor/slider/do-update/' + ${sliderId}}" method="post"
							th:object="${sliderForm}" enctype="multipart/form-data" class="p-6">

							<!-- Slider Type -->
							<div class="mb-5">

								<label for="slideType" class="block mb-2 font-medium text-gray-700">

									Slide Type

								</label>

								<select id="slideType" data-th-field="*{sliderType}" class="w-full border border-gray-300 rounded-lg p-2.5
                                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

									<option value="">
										-- Select Slide Type --
									</option>

									<option value="MAIN">
										Main
									</option>

									<option value="OTHER">
										Other
									</option>

								</select>

								<p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('sliderType')}"
									th:errors="*{sliderType}">
								</p>

							</div>


							<!-- About -->
							<div class="mb-5">

								<label for="about" class="block mb-2 font-medium text-gray-700">

									About

								</label>

								<input id="about" data-th-field="*{about}" type="text" class="w-full border border-gray-300 rounded-lg p-2.5
                                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

								<p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('about')}"
									th:errors="*{about}">
								</p>

							</div>


							<!-- Banner Text -->
							<div class="mb-5">

								<label for="bannerText" class="block mb-2 font-medium text-gray-700">

									Banner Text

								</label>

								<input id="bannerText" data-th-field="*{bannerText}" type="text" class="w-full border border-gray-300 rounded-lg p-2.5
                                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

								<p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('bannerText')}"
									th:errors="*{bannerText}">
								</p>

							</div>


							<!-- Upload -->
							<!-- Upload Image / Video -->
							<div class="mb-4">

								<label for="image_file_input" class="block mb-2 font-medium text-gray-700">
									Upload Image / Video
								</label>

								<input type="file" id="image_file_input" name="file" th:field="*{file}"
									accept="image/*,video/*" class="block w-full border border-gray-300 rounded-lg
               p-2 bg-white cursor-pointer">

								<p class="mt-1 text-sm text-gray-500">
									Select a new image or video to replace the current media.
								</p>

								<!-- Validation -->
								<p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('file')}"
									th:errors="*{file}">
								</p>

							</div>


							<!-- ============================= -->
							<!-- MEDIA PREVIEW FRAME -->
							<!-- ============================= -->

							<div id="media_preview_frame" class="relative w-full h-64
           border border-gray-300
           rounded-lg
           bg-gray-100
           overflow-hidden
           flex items-center justify-center">

								<!-- No Media -->
								<div id="no_media_preview" class="absolute inset-0
               flex items-center justify-center
               text-gray-400 text-lg">
									No media selected
								</div>


								<!-- IMAGE PREVIEW -->
								<img id="upload_image_preview" src="" alt="Image Preview" class="hidden absolute inset-0
               w-full h-full
               object-cover
               rounded-lg">


								<!-- VIDEO PREVIEW -->
								<video id="upload_video_preview" class="hidden absolute inset-0
               w-full h-full
               object-cover
               rounded-lg" muted loop playsinline>

									Your browser does not support the video tag.

								</video>

							</div>

							<!-- Submit -->
							<button type="submit" class="w-full bg-blue-600
                                   hover:bg-blue-700
                                   text-white
                                   font-medium
                                   px-4 py-2.5
                                   rounded-lg
                                   transition">

								Update Slider

							</button>

						</form>

					</div>

				</div>

			</div>

		</main>

	</div>


	<!-- ================================= -->
	<!-- JAVASCRIPT -->
	<!-- ================================= -->

	<script>


	</script>

</body>

</html>
