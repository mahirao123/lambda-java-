<div id="viewContactModal"
     data-th-fragment="viewContact"
     class="hidden fixed top-0 left-0 right-0 z-50 flex justify-center items-center w-full h-full bg-black bg-opacity-50">

    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-6 relative">

        <!-- Close -->
        <button onclick="closeViewModal()" 
                class="absolute top-3 right-3 text-xl text-gray-500 hover:text-red-500 cursor-pointer">
            ✖
        </button>

        <!-- Image -->
        <div class="flex justify-center">
            <img id="vImage"
                 class="w-24 h-24 rounded-full border-4 border-blue-500">
        </div>

        <!-- Details -->
        <div class="mt-4 space-y-2 text-sm">

            <div class="flex justify-center">
                <span class="font-semibold w-28">Name:</span>
                <span id="vName" class="text-gray-800"></span>
            </div>

            <div class="flex justify-center">
                <span class="font-semibold w-28">Email:</span>
                <span id="vEmail" class="text-gray-600"></span>
            </div>

            <div class="flex justify-center">
                <span class="font-semibold w-28">Phone:</span>
                <span id="vPhone" class="text-gray-600"></span>
            </div>

            <div class="flex justify-center">
                <span class="font-semibold w-28">Favorite:</span>
                <span id="vFavorite" class="text-green-600"></span>
            </div>

            <div class="flex justify-center">
                <span class="font-semibold w-28">LinkedIn:</span>
                <a id="vLinkedInLink"
                   class="text-blue-600 hover:underline"
                   target="_blank">
                   View
                </a>
            </div>

            <div class="flex justify-center">
                <span class="font-semibold w-28">Website:</span>
                <a id="vWebsiteLink"
                   class="text-green-600 hover:underline"
                   target="_blank">
                   Visit
                </a>
            </div>

        </div>

    </div>
</div>
