<!DOCTYPE html>
<html data-th-replace="~{base :: parent(~{:: #content},~{::title},~{::script})}" lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>All your contacts</title>

</head>

<body>

	<div id="content">

		<!-- This sidebar will show when user  loggedin -->
		<div th:if="${loggedInUser}">
			<div data-th-replace="~{user/sidebar :: sidebar}">
			</div>
		</div>


		<div class=" sm:pl-65 pt-10">
			<div>
				<h1 class="text-5xl text-center"> Your All Contacts</h1>
				<p class="text-center" data-th-text="${pageContacts.totalElements}+' results found'" ></p>

				<div class="contacts_container p-5">


					<div
						class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">
						
						<div data-th-replace="~{message :: messagebox}"></div>
						
						<form 
						data-th-object="${contactSearchForm}"
						data-th-action="@{'/user/contacts/search'}">
							<div
							class="flex items-center  justify-start space-x-2 flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 p-4">
						
							<!-- select options -->

							<div class="bg-white  rounded-xl shadow-lg max-w-96">

								<select data-th-field="*{field}"
								
								class="w-full px-8 py-1.5 border border-gray-400 rounded-lg 
							            focus:outline-none focus:ring-2 focus:ring-blue-300 
							            focus:border-blue-400">

									<option value="">Select..</option>
									<option value="name">Name</option>
									<option value="phone">Phone</option>
									<option value="email">Email</option>

								</select>

							</div>

								<!-- Search Field -->

							<label for="input-group-1" class="sr-only">Search</label>
							
							<div class="relative">
								<div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
									<svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
										width="24" height="24" fill="none" viewBox="0 0 24 24">
										<path stroke="currentColor" stroke-linecap="round" stroke-width="2"
											d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
									</svg>
								</div>
								<input data-th-field="*{value}"
								 type="text" id="input-group-1" class=" rounded-lg block w-full max-w-96 ps-9 pe-3 py-2 bg-neutral-secondary-medium border border-default-medium 
								text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
									placeholder="Search">
								</div>

							<!-- Search button -->
							<button type="submit"
							
								class=" px-3 py-1.5 bg-gray-700 text-white rounded-lg border border-default-medium cursor-pointer">Search</button>
						</div>
						</form>

						<!-- table Start -->
						<table 
						data-th-unless="${pageContacts.empty}"
						class="w-full text-sm text-left rtl:text-right text-body">
							<thead
								class="text-sm text-body bg-neutral-secondary-medium border-b border-t border-default-medium">
								<tr>
									<th scope="col" class="px-6 py-3 font-medium">
										Name
									</th>
									<th scope="col" class="px-6 py-3 font-medium">
										Phone
									</th>
									<th scope="col" class="px-6 py-3 font-medium">
										Linked
									</th>
									<th scope="col" class="px-6 py-3 font-medium">
										Action
									</th>
								</tr>
							</thead>
							<tbody>

								<tr data-th-object="${c}" data-th-each="c:${pageContacts.getContent()}"
									class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium">

									<th scope="row"
										class="flex items-center px-6 py-4 font-medium text-heading whitespace-nowrap">
										<img class="w-10 h-10 rounded-full"
											onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJoAAACUCAMAAABcK8BVAAAAOVBMVEWmpqb////y8vKioqL29vaenp76+vqpqanu7u6srKzExMTn5+ezs7PY2Ni5ubm8vLzf39/MzMzS0tKlFK0SAAAHMUlEQVR4nO2c2bqjKhCF3QwO4Pz+D9uYqFHGWqjJuTjrqru/hPxdQFUxFMXff1bFrwHCugWtFIzVtX6prhkT5R2tXkUrdTepvq0Kzrk04rwomrZXU6ev8l1AK9momqIoFhpb5t940aiRXeDLRSvHqeXSA3UClLydxly6LLRS96YH41g7XlH1eX2bgaanStKwNslq0l9AG3uqvc6268dn0cquAQ12MF3TYf0KoXVthsEOpmu7Z9DKsci22G65ApivZLS6v2Sx3XJ9fTOaUJcttkkqcSfaeG2QncVb2mSloJX3mewtqSgjjoBW32myt3hLGHFptO5urrfSfiSJNt3cmZvkdBFN3OMyfOJ9YqbG0VjzGJlha1g+Wv0kWZIthlb78td74WITNYJWVw+DGVURtjBa/dDUPEuG2YJorPkGmVl+BcdbCE18B2zJf0M+JIBWPufPHLY+EFADaMPXyAzbgKDNX5kCm+RMRxu/aLOXvAmcD+1rU+Aj3zT1oX1vCmziPQ1t/jqZYfMMNxeNfR9skdulLtr96TZFvE2jdT8hM2xORm6j/ag7F9ldaqOpHxnNmM1eLFho9c/I3PzIQlO/IysKFUPTPzSakY6gfT8OHGXFhBPalZx7XeLwK0sdyYJo2SON83ZQc2c0q6HNp1MhtDpvOWC4Zl0zsYoxPefSNXUALSuu80rp5YzqKFFqVWU1NgfQctadctDCAnvBiTorh6/8aBqfBLzVpcv1VqkzEgWpvWgD3pBiHovtlmMZu5mDDy1jTTwHTbYaboabPKyYP2jwWoV3EZOthoNTLD560NCcg0CWwcaVBw1rwuQwBDLDNqF2c9HA+ckHEplhA53IZ47uaOD/rqppZIyB23SfjHJHa6EGCspAW80G7u63NhrD/m89mcyw9VDTFbPQRujrUiNo4DAeLTQstPcJX3vFbHuI39Agr0ZyaQc0yLntnm1FK6FZ0JCn51tYItiWZzTkuwXVp+1mwzKHM5pARirYn2iPbiuEIiMWSLA/TY9CzesTWgd9F5qfi0qo+e6EBoWpCkdDHPoWqlY0aJy2OBriADbvsaIhTpEPOBqSfmyL+AIP7k+jbQE+Cw30HdfQIHedYzWk/SYf7eFpcAWN42hQXnMBTaJkjEEZ2xW0EY2h4wU0aCxwhaJha9x852G+i5ExBjafHQ2MsB4V2MKjOEcDLNcDexTsz223aEUDv8yx/gQbP4d3cK+UuOGRZ7TtKH5Fw2a3SdnoC1GhwY07OZ7QMJ/4unxGRkPPSay1gUC3miR16ZKx+ydOaFj8fYnWpULDDVvr0IzrMMR1MrxDvF+WydvzeKmq03u5GXfgnD0P0GG/2mhjW/NvMnycfA7hN7S8K37x8ZYxzorDRcANrcw7Opt8p0ArmJiymlxTosOGad6BI2+9R1QLWM45UHHcnd/R0HiwtcTV6MIJMarMc0c5OmjQtsQJrmi7BUbsWIx1bU5tzru50kFDU7ZTc7yfOl0v0rqbep5/UH44f/+g0QMKb9ywyIuqWVT5CuV6+q3ow/2dDxrZfZjVO7SzxKc/+pHL4Q7x4TyU6B5fe5JA0F4+b6YF8fOHC1kHNNKv8f4dngSxQgj8/PE+1gGNMkflsAUnwea0e+B8/nx+oLRfetEIC4RT4i1Y4loCr04H4ITzR3686HFES4Y8aS0JhJ7ClpN8skKsSBej6ABa0rXNtts37nXxrq4reflhN0ikzuJPl4pOaPFgZdtsD5azarjcKmyXPzVq9ofWhN3kGESLXkIJrouXGFWPs1JD3w9KzWN9CFv2Z6PjufoLo0W8T2IN 											data-th-src="@{*{picture}}" alt="Jese image">
										<div class="ps-3">
											<div class="text-base font-semibold" data-th-text="*{name}"></div>
											<div class="font-normal text-body" data-th-text="*{email}"></div>
										</div>
									</th>
									<td class="px-6 py-4">
										<i class="fa-solid fa-phone w-4 h-4"></i>
										<spam data-th-text="*{phoneNumber}"></spam>
									</td>
									<td class="px-6 py-4">
										<div class="flex items-center ">
											<div data-th-if="*{favorite}"
												class="h-2.5 w-2.5 rounded-full bg-green-500 me-2"></div>
												<!-- Website -->
												<a 
												   th:if="${c.websiteLink != null and !#strings.isEmpty(c.websiteLink)}"
												   th:href="${c.websiteLink}" 
												   target="_blank">
												   <i class="fa-solid fa-link h-5 w-5 mr-2"></i>
												</a>

												<!-- LinkedIn -->
												<a 
												   th:if="${c.linkedInLink != null and !#strings.isEmpty(c.linkedInLink)}"
												   th:href="${c.linkedInLink}" 
												   target="_blank">
												   <i class="fa-brands fa-linkedin h-5 w-5"></i>
												</a>
										</div>
									</td>
									<td class="px-6 py-4">
										<div>
											<!-- <a data-th-href="@{'/user/contacts/delete/'+*{id}}">
												<i class="w-6 h-6 fa-solid fa-delete-left"></i>
											</a> -->

										<!-- delete contact button -->
											<button th:onclick="deleteContact([[${c.id}]])"
											class="bg-red-500 text-white px-2 py-1 rounded cursor-pointer"
											>
												<i class="w-6 h-6 fa-solid fa-delete-left"></i>
											</button>

											<!-- Update Contact button -->
											<a data-th-href="@{'/user/contacts/update_contact/'+*{id}}"
											class="bg-green-500 text-white px-2 py-1 rounded pb-3"
											><i
													class="w-6 h- fa-solid fa-pen "></i></a>

												<!-- View Contact button -->
										<!--	<a data-th-href="@{'/user/contacts/view_contact/'+*{id}}">
												<i	class="w-6 h-6 fa-solid fa-eye"></i></a>	-->	
																																				
												<button th:onclick="viewContact(this)"

												th:data-id="${c.id}"
												th:data-name="${c.name}"
												th:data-email="${c.email}"
												th:data-phone="${c.phoneNumber}"
												th:data-image="${c.picture != null ? c.picture : '/images/raj.jpeg'}"
												th:data-linkedin="${c.linkedInLink}"
												th:data-website="${c.websiteLink}"
												th:data-favorite="${c.favorite}"
												class="bg-blue-500 text-white px-2 py-1 rounded"
												>
												
													<i	class="w-6 h-6 fa-solid fa-eye cursor-pointer"></i>
												</button>

										</div>
									</td>
								</tr>
							</tbody>
						</table>

						<div 
						data-th-unless="${pageContacts.empty}"
						class="pagination_container bg-white p-5 text-center">
							<nav aria-label="Page navigation example">
								<ul class="inline-flex -space-x-px text-sm">
									<li data-th-unless="${pageContacts.first}">
										<a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+ ${pageContacts.number-1}}"
											class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border 
								  border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-s-base text-sm px-3 h-9 
								  focus:outline-none">Previous</a>
									</li>
									<li data-th-each="index : ${#numbers.sequence(0,pageContacts.totalPages-1)}">
										<a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${index}}"
											data-th-classappend="${index==pageContacts.number?'bg-blue-600':'bg-white-600'}"
											class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border
								    border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium text-sm w-9 h-9 
									focus:outline-none" data-th-text="${index+1}">1</a>
									</li>

									<li data-th-unless="${pageContacts.isLast}">
										<a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${pageContacts.number+1}}"
											class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border 
								  border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-e-base text-sm px-3 h-9 
								  focus:outline-none">Next</a>
									</li>
								</ul>
							</nav>
						</div>
						
						<h1 
												class="text-center text-5xl bg-white p-4"
												data-th-if="${pageContacts.empty}"
												>No result found</h1>
					</div>


				</div>

			</div>
		</div>
	</div>
</body>

</html>
